#General options for the Summoner mod
["General Options"]
	#Enable/Disable edit mode for summon groups. See the curse page for more info.
	isInEditMode = false
	#Add resource name of the entities to blacklist. Like minecraft:creeper
	mobBlackList = []
	#Enable/Disable the visual overlay of summons (CLIENT only)
	summonOverlay = true
	#Percent chance (0-100) to capture a mob's spirit on kill when you have an empty Summoner Orb in your inventory. Set to 100 for guaranteed capture in survival. Set to -1 to use the original health-based chance (1 in maxHealth+1, about 5% for most mobs). Changes to this file are picked up automatically without restarting.
	# Default: -1
	# Range: -1 ~ 100
	captureChancePercent = -1
	#If true, Summoners can spawn as late-wave raid members (waves 5-7, max 1 per wave). Requires a game restart to apply.
	enableRaidSpawns = true
