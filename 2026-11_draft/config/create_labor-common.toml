#Create Villager Labor - TLM Chat Bubble Compatibility
[tlm_chat_bubble]
	#Enable Touhou Little Maid chat bubble compatibility when maids are working.
	#When enabled, maids sitting at worker seats will display random chat bubbles.
	enable = true
	#Interval (in ticks) between chat bubble updates when a maid is working.
	#Default: 100 ticks (5 seconds). Lower values = more frequent bubbles.
	# Default: 100
	# Range: 20 ~ 600
	interval = 100

#Create Villager Labor - EMC (ProjectE) Integration
[emc]
	#How many FE are worth 1 EMC when the EMC Seller converts energy.
	#Default: 1000, i.e. 1000 FE = 1 EMC (an iron ingot is 256 EMC).
	# Default: 1000
	# Range: 1 ~ 1000000
	fe_per_emc = 1000
	#Internal FE buffer of the EMC Seller.
	#Default: 1000000 FE (1 MFE).
	# Default: 1000000
	# Range: 1000 ~ 100000000
	seller_energy_capacity = 1000000
	#Maximum FE the EMC Seller accepts per tick.
	#Prevents a huge power grid from dumping everything in a single tick.
	#Default: 1000000 FE (1 MFE).
	# Default: 1000000
	# Range: 1 ~ 100000000
	seller_max_receive = 1000000
