[work]
	#加工过程中物品被销毁的概率 (0.0–1.0)
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	destroyChance = 0.15
	#销毁触发时，一批物品被销毁的最小比例 (0.0–1.0)
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	destroyRatioMin = 0.2
	#销毁触发时，一批物品被销毁的最大比例 (0.0–1.0)
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	destroyRatioMax = 0.5

[rebellion]
	#启用工人起义系统
	enableRebellion = false
	#起义触发基础时间（秒）
	# Default: 300
	# Range: 10 ~ 3600
	rebellionTriggerTime = 300
	#每次检测起义触发的基础概率
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	rebellionChance = 0.05
	#起义持续时间（秒）
	# Default: 300
	# Range: 5 ~ 600
	rebellionDuration = 300
	#起义检测半径（方块）
	# Default: 5
	# Range: 1 ~ 32
	rebellionRadius = 5
	#起义工人是否可以拆除设备（仅在开启起义时生效）
	canDestroyDevices = true
	#拆家冷却时间（秒）
	# Default: 10
	# Range: 1 ~ 60
	destroyCooldown = 10
	#拆家强度（0.0-1.0）：越高拆得越勤，0 表示不拆
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	destroyIntensity = 0.5
